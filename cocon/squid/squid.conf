# Egress proxy for cocon: domain allowlist, HTTPS via CONNECT only.
# Only on its address on broker-egress (compose.yml): only the credential broker reaches it.
http_port squid-in:3128

acl allowlist dstdomain -n "/etc/squid/cocon/allowlist.txt"
# This repo only: ~/.config/cocon/allow/<owner>__<repo>.txt (see compose.yml).
acl repo_allowlist dstdomain -n "/etc/squid/repo-allowlist.txt"
# Raw-IP destinations (dotted, hex/decimal forms, IPv6 bracketed or not). -n: never a reverse lookup, so a PTR
# record can't satisfy the allowlist and a denied request leaks nothing through DNS.
acl raw_ip dstdom_regex -n -i ^(0x[0-9a-f]+|[0-9]+)(\.(0x[0-9a-f]+|[0-9]+))*$ ^\[?[0-9a-f]*:[0-9a-f:.]*\]?$
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny raw_ip
http_access allow allowlist
http_access allow repo_allowlist
http_access deny all

# No caching, no identifying headers.
cache deny all
via off
forwarded_for delete
# The audit log (ADR 0012): a file on the host, linked here by compose.yml; read it with
# cocon --proxy-log. Bytes up (>st) include what a CONNECT tunnel carried.
# logfile_rotate 0: `squid -k rotate` only reopens it; cocon moves and compresses the old one.
logformat audit %{%Y-%m-%dT%H:%M:%S%z}tl %>a %Ss/%03>Hs up=%>st down=%<st %rm %ru
access_log stdio:/var/log/squid/audit.log audit
logfile_rotate 0
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
